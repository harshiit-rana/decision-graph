[project]
name = "decision-graph"
version = "0.1.0"
description = "Organizational Intelligence Engine — Phase 1 (knowledge graph + GitHub ingestion)"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
]

# `dg ask` only. Optional because it is the one feature that calls a third-party service,
# and every other command works without it -- but declared, because the Dockerfile was
# installing it while this file was not, so `pip install -e .` produced an installation
# where that command could not run and advised rebuilding a Docker image the user might
# not be using (issue #65).
[project.optional-dependencies]
nlp = ["openai>=1.0"]

[project.scripts]
dg = "decision_graph.cli:main"
dg-ingest = "decision_graph.run:main"
dg-query = "decision_graph.query:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
