name: decision-graph

services:
  db:
    image: postgres:16
    environment:
      # Read only when the volume is first created; after that the password lives in the
      # database. The `dg` fallback is public, so `dg init` replaces it with a random one,
      # in the database and in .env as DG_DB_PASSWORD, without touching any data (#118).
      # The graph is public GitHub content, but its integrity is the product: anyone who
      # can log in as this superuser can rewrite the evidence.
      POSTGRES_PASSWORD: ${DG_DB_PASSWORD:-dg}
      POSTGRES_USER: postgres
      POSTGRES_DB: dg
    volumes:
      - dgdata:/var/lib/postgresql/data
    ports:
      # Published only so you *can* reach it with your own tools. Nothing in `dg` uses
      # this — the app talks to `db:5432` over the compose network — so a conflict here
      # is harmless. Change it with DG_DB_PORT=55444 if 55434 is taken.
      #
      # Bound to 127.0.0.1, so only this machine can connect. Without a host IP, Docker
      # publishes on every interface and its iptables rules bypass most host firewalls, so
      # anyone on the same network could reach the superuser (#118). To expose it on
      # purpose, set DG_DB_BIND=0.0.0.0, and only once a strong DG_DB_PASSWORD is in place.
      - "${DG_DB_BIND:-127.0.0.1}:${DG_DB_PORT:-55434}:5432"
    healthcheck:
      # `dg` must not start before Postgres accepts connections, or first-run init fails
      # with a confusing "connection refused" that resolves itself on retry.
      test: ["CMD-SHELL", "pg_isready -U postgres -d dg"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Not user-managed, by design. The database lives at a fixed address on this
      # network, so exporting a DSN by hand was never configuration — it was an
      # implementation detail leaking onto the host.
      # The password comes from .env (written by `dg init`); compose reads that file for
      # substitution. It is URL-safe by construction, so it needs no escaping here.
      DATABASE_URL: postgresql://postgres:${DG_DB_PASSWORD:-dg}@db:5432/dg
      DG_PROJECT_DIR: /work
    volumes:
      # The project itself: source, migrations, and .env. Bind-mounted rather than copied
      # so `dg init` can write .env where you can see it, and code edits need no rebuild.
      - .:/work
    working_dir: /work

  # Polls on an interval so the graph stays current without anyone remembering. Off by default:
  # `docker compose --profile scheduled up -d scheduler`. It is its own process, never part of the
  # webhook receiver, and it takes the same per-repository writer lock as `dg ingest`, so a round
  # that finds another writer is skipped. Needs GITHUB_TOKEN (and TARGET_REPO) in .env (#163).
  scheduler:
    profiles: ["scheduled"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DG_DB_PASSWORD:-dg}@db:5432/dg
      DG_PROJECT_DIR: /work
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TARGET_REPO: ${TARGET_REPO:-pallets/flask}
    volumes:
      - .:/work
    working_dir: /work
    # The image's entrypoint is `python -m decision_graph.cli`, so this is `dg ingest --every ...`,
    # which picks the least-privilege role for ingestion like any other `dg ingest` (#172).
    command: ["ingest", "--every", "${DG_POLL_INTERVAL:-1h}"]
    restart: unless-stopped

volumes:
  dgdata:
